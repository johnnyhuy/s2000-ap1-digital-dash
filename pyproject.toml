[project]
name = "s2000-ap1-digital-dash"
version = "0.1.0"
description = "S2000 digital dash — Phase 1 bench mock (AP1/AP2 face styles, pygame gauges, frozen JSON protocol)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pyserial>=3.5",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.uv]
package = false
