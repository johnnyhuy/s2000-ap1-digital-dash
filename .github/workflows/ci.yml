name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests + headless smoke + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11+
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System fonts for pygame SysFont
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Install Python deps
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Headless smoke
        run: python src/gauge_ui.py --smoke

      - name: Headless smoke (explicit --no-intro)
        run: python src/gauge_ui.py --smoke --no-intro

      - name: E2E mock ESP32 pipe → smoke frames
        run: |
          python -m mocks.esp32_uart --count 25 --immediate --scenario drive \
            | python src/gauge_ui.py --smoke --screenshot /tmp/e2e-shots
          python -c "import os; assert sorted(os.listdir('/tmp/e2e-shots')) == [
            '01_sweep.png','02_ready.png','03_reveal.png','04_live.png','05_cruise.png'
          ]"

      - name: E2E unittest module
        run: python -m unittest tests.test_e2e -v

  harness:
    name: web harness build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/harness
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/harness/package-lock.json

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Production build
        run: npm run build
